name: Update Scholar Data

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements-scholar.txt

      - name: Fetch Scholar data
        timeout-minutes: 10
        run: python scripts/fetch_scholar.py

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet src/data/scholar.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/scholar.json
          git commit -m "chore: update scholar citation data"
          git pull --rebase origin main
          git push

      - name: Report failure as issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'scholar-update',
            })
            if (existing.data.length > 0) return
            await github.rest.issues.create({
              ...context.repo,
              title: 'Scholar data update failed',
              body: [
                'The weekly Google Scholar fetch failed — homepage citation data is going stale.',
                '',
                `[Failed run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                'Close this issue after fixing `scripts/fetch_scholar.py` / `.github/workflows/update-scholar.yml`.',
              ].join('\n'),
              labels: ['scholar-update'],
            })
